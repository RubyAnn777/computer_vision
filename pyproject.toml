[project]
name = "computer-vision"
version = "0.1.0"
description = "Final project of the ESMT Computer vision class. Covers Image morphing, photomosaics and object detection."
readme = "README.md"
authors = [
    { name = "Ruby Ann Grambauer", email = "ruby.grambauer@esmt.berlin" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
