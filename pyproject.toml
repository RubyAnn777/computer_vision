[project]
name = "computer-vision"
version = "0.1.0"
description = "Final project of the ESMT Computer vision class. Covers Image morphing, photomosaics and object detection."
readme = "README.md"
authors = [
    { name = "Ruby Ann Grambauer", email = "ruby.grambauer@esmt.berlin" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]


# this ruff setup has been done with AI support

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-include = ["notebooks/*.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports, undefined names
    "I",        # import sorting (replaces isort)
    "B",        # flake8-bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax for 3.12
    "N",        # pep8-naming
    "SIM",      # simplifications
    "NPY",      # NumPy-specific rules (deprecated APIs, legacy RNG)
    "PT",       # pytest style
    "RUF",      # ruff's own rules
    "D",        # docstrings
    "PTH",      # flake8-use-pathlib: Path over os.path
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "slow: long-running tests (rendering, training); skipped by the pre-commit hook",
]

[tool.coverage.run]
source = ["computer_vision"]
branch = true
